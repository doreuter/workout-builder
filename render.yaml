# Render Blueprint: https://render.com/docs/blueprint-spec
# Create the service from this file in the Render dashboard (New → Blueprint), then fill in the
# variables marked `sync: false` when Render asks for them.
services:
  - type: web
    name: vibegrind
    region: frankfurt        # EU hosting for users' health data; a region can't be changed later
    runtime: python
    plan: starter            # a paid plan is needed for the persistent disk below
    buildCommand: pip install -r requirements.txt
    # --proxy-headers: Render terminates HTTPS in front of the app, so trust its forwarded headers
    # (needed for secure cookies and per-IP rate limits).
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: APP_MODE
        value: hosted
      - key: CANONICAL_HOST
        value: vibegrind.app      # other addresses (onrender.com, www) redirect here
      - key: WORKOUT_DB
        value: /var/data/app.db
      - key: CLAUDE_MODEL
        value: claude-haiku-5-5
      - key: DAILY_MESSAGE_LIMIT
        value: "30"
      - key: MONTHLY_BUDGET_USD
        value: "10"
      - key: SESSION_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false          # paste a new key made just for the hosted app
      - key: ADMIN_EMAILS
        sync: false          # your email; that account can sign up without a code and create invites
      - key: GARMIN_PERSONAL_API_KEY
        sync: false          # optional: your Garmin Connect Personal API key, for your Readiness dashboard
      - key: THUNDERFOREST_API_KEY
        sync: false          # optional: Thunderforest key, for the cycling map under climb suggestions
